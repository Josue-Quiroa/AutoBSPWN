; AutoBSPWN polybar v3.4.2 — one clean rounded floating bar (no overlapping blocks).
;   left  : launcher │ workspaces │ float/tile mode
;   center: clock (date on hover-less, click = calendar)
;   right : target │ VPN · IP │ updates · CPU · RAM · battery │ volume │ tools · clipboard · theme │ tray · power
; fixed-center = false: the clock is centered in the space that is really free, so blocks
; can never be drawn on top of each other (3.1.0 used fixed-center + a transparent bar:
; on small/VM screens the left/right islands ran over the centre and looked "stacked").
; Long labels (VPN profile, target name) are shortened by their scripts so the bar fits 1280 px.
; Works on polybar 3.6.3 (Parrot 6, tray-position) and 3.7.x (Kali / Parrot 7, internal/tray).
; include-file does NOT understand ${env:...}: keep the leading "~".
; Colors: ~/.config/polybar/colors.ini (written by theme-sync from themes/<theme>.ini)
include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
; floating bar, 10 px from the screen edges (bspwm reserves its space)
width = 100%:-20
; v3.4: launch.sh exports the monitor's DPI (96 / 120 / 144 / 192) and the scaled height
height = ${env:POLYBAR_HEIGHT:30}
dpi = ${env:POLYBAR_DPI:96}
offset-x = 10
offset-y = 6
radius = 10
fixed-center = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
line-color = ${colors.primary}
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 0
separator =
; font-0 text · font-1 icons / workspace dots · font-2 small separators
font-0 = JetBrainsMono Nerd Font:style=Bold:size=9;3
font-1 = JetBrainsMono Nerd Font:size=11;3
font-2 = JetBrainsMono Nerd Font:size=10;3
font-3 = Hack Nerd Font:size=10;3
font-4 = FontAwesome:size=10;3

modules-left = launcher sep bspwm sep floatmode
modules-center = clock
modules-right = present target sep vpn ethernet sep updates cpu memory battery sep pulseaudio sep tools clip theme sep power

; Polybar < 3.7 (Parrot 6): launch.sh sets POLYBAR_TRAY_POS=right on the first bar
; Polybar 3.7+ (Parrot 7 / Kali): tray-position=none and the internal/tray module is used
tray-position = ${env:POLYBAR_TRAY_POS:none}
tray-padding = 4
tray-maxsize = 15
tray-background = ${colors.background}

cursor-click = pointer
cursor-scroll = ns-resize
; A docked bar: bspwm reserves its space (no top_padding needed)
override-redirect = false
wm-restack = bspwm
enable-ipc = true

; Same bar + internal/tray module before the power button (polybar 3.7+, first monitor).
; (polybar only expands ${env:...} when it is the whole value, so the module list can't be
;  switched with an env var — a second bar section is the portable way.)
[bar/main-tray]
inherit = bar/main
modules-right = present target sep vpn ethernet sep updates cpu memory battery sep pulseaudio sep tools clip theme sep tray power

; ---------------------------------------------------------------- separators
[module/sep]
type = custom/text
content = "│"
content-font = 3
content-foreground = ${colors.muted}
content-padding = 1

[module/tray]
type = internal/tray
format-margin = 4px
tray-size = 15
tray-spacing = 6px
tray-background = ${colors.background}

; ---------------------------------------------------------------- left
[module/launcher]
; left: apps (Super+d) · right: system info · middle: reload bar
type = custom/text
content = "󰀻"
content-font = 2
content-foreground = ${colors.primary}
content-padding = 1
click-left = rofi -show drun &
click-right = $HOME/.config/bspwm/scripts/sysinfo.sh &
click-middle = $HOME/.config/polybar/launch.sh &

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
format = <label-state>
label-focused = 
label-focused-foreground = ${colors.primary}
label-focused-padding = 1
label-focused-font = 2
label-occupied = 
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-occupied-font = 2
label-urgent = 
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1
label-urgent-font = 2
label-empty = 
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-empty-font = 2

[module/floatmode]
; Float / tile mode of the focused desktop — left click toggles (Super+Shift+s)
type = custom/script
exec = $HOME/.config/bspwm/scripts/float-mode.sh --watch
tail = true
format = <label>
format-foreground = ${colors.lavender}
format-padding = 1
click-left = $HOME/.config/bspwm/scripts/float-mode.sh &

[module/xwindow]
type = internal/xwindow
format = <label>
label = %title:0:42:…%
label-foreground = ${colors.muted}

; ---------------------------------------------------------------- center
[module/clock]
; left: calendar under the clock · right: date + time notification
type = custom/script
exec = $HOME/.config/polybar/scripts/clock.sh
interval = 5
format = <label>
format-foreground = ${colors.foreground}
format-padding = 1
click-left = $HOME/.config/bspwm/scripts/calendar.sh &
click-right = notify-send -a AutoBSPWN "$(date '+%A %d %B %Y')" "$(date '+%H:%M:%S')"

; Old name (v2.x bars listed "date")
[module/date]
inherit = module/clock

; ---------------------------------------------------------------- right: pentest
[module/present]
; v3.4.2 presentation (Super+F12): "OCULTO" while IPs are hidden · "REC" while recording
; (Super+Shift+F12). Left click = presentation off · right = start/stop recording · middle = menu
type = custom/script
exec = $HOME/.config/bspwm/scripts/present-mode.sh --bar
interval = 2
format = <label>
format-padding = 1
click-left = $HOME/.config/bspwm/scripts/present-mode.sh --off
click-right = $HOME/.config/bspwm/scripts/record.sh --toggle
click-middle = $HOME/.config/bspwm/scripts/record.sh --menu

[module/target]
; Target HUD — left: actions menu (Super+i) · middle: copy IP · right: set / change target
type = custom/script
exec = $HOME/.config/polybar/scripts/focus_ip.sh
interval = 2
format = <label>
format-padding = 1
click-left = $HOME/.config/bspwm/scripts/target-menu.sh &
click-middle = $HOME/.config/polybar/scripts/focus_ip.sh --copy
click-right = $HOME/.config/bspwm/scripts/target-menu.sh --set &

; v2.0 name, kept so custom bars that still list "focusip" keep working
[module/focusip]
inherit = module/target

[module/vpn]
; left: VPN / lab switcher (Super+v) · middle: reconnect last · right: copy tun IP
type = custom/script
exec = $HOME/.config/polybar/scripts/vpn_status.sh
interval = 3
format = <label>
format-padding = 1
click-left = $HOME/.config/bspwm/scripts/vpn-menu.sh &
click-middle = $HOME/.config/bspwm/scripts/vpn-menu.sh --reconnect &
click-right = $HOME/.config/polybar/scripts/vpn_status.sh --copy

[module/ethernet]
; left: copy IP · right: interfaces
type = custom/script
exec = $HOME/.config/polybar/scripts/ethernet_status.sh
interval = 5
format = <label>
format-padding = 1
click-left = $HOME/.config/polybar/scripts/ethernet_status.sh --copy
click-right = kitty --class floating -e bash -c 'ip -br a; echo; read -r -n1 -p "Enter para cerrar"'

; ---------------------------------------------------------------- right: system
[module/updates]
type = custom/script
exec = $HOME/.config/polybar/scripts/updates.sh
interval = 900
format = <label>
format-padding = 1
click-left = kitty --class floating -e bash -c 'sudo apt update && apt list --upgradable; echo; read -r -n1 -p "Enter para cerrar"'

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}
format-padding = 1
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
format-padding = 1
label = %percentage_used:2%%

[module/battery]
; silent on VMs / desktops
type = custom/script
exec = $HOME/.config/polybar/scripts/battery.sh
interval = 30
format = <label>
format-padding = 1

[module/pulseaudio]
; scroll: volume · left: mute · right: pavucontrol
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1
label-volume = %percentage%%
ramp-volume-foreground = ${colors.primary}
format-muted = <label-muted>
format-muted-padding = 1
label-muted = 󰝟 mute
label-muted-foreground = ${colors.muted}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol >/dev/null 2>&1 &

; ---------------------------------------------------------------- right: quick actions
[module/tools]
; Pentest tools launcher (Super+p)
type = custom/text
content = ""
content-font = 2
content-foreground = ${colors.primary}
content-padding = 1
click-left = $HOME/.config/bspwm/scripts/tools-menu.sh &

[module/clip]
; Clipboard history (Super+c)
type = custom/text
content = "󰅇"
content-font = 2
content-foreground = ${colors.teal}
content-padding = 1
click-left = $HOME/.config/bspwm/scripts/clipboard.sh &

[module/theme]
; left: theme picker (Super+Alt+t) · right: wallpaper · scroll: cycle themes
type = custom/text
content = "󰏘"
content-font = 2
content-foreground = ${colors.pink}
content-padding = 1
click-left = $HOME/.config/bspwm/scripts/theme-menu.sh &
click-right = $HOME/.config/bspwm/scripts/wallpaper.sh &
scroll-up = $HOME/.config/bspwm/scripts/theme-menu.sh --next &
scroll-down = $HOME/.config/bspwm/scripts/theme-menu.sh --prev &

[module/dashboard]
; eww dashboard (Super+F2) — optional, add it to a modules-* list if you like
type = custom/text
content = "󰕮"
content-font = 2
content-foreground = ${colors.lavender}
content-padding = 1
click-left = $HOME/.config/bspwm/scripts/dashboard.sh &

[module/power]
; Power menu (Super+Shift+e) · right click: eww dashboard
type = custom/text
content = "⏻"
content-font = 2
content-foreground = ${colors.alert}
content-padding = 1
click-left = $HOME/.config/bspwm/scripts/power-menu.sh &
click-right = $HOME/.config/bspwm/scripts/dashboard.sh &

; ---------------------------------------------------------------- optional modules
; (add them to modules-right if you want them)
[module/netspeed]
type = internal/network
interface = ${env:POLYBAR_NET_IFACE:}
interface-type = wired
interval = 2
accumulate-stats = true
unknown-as-up = true
format-connected = <label-connected>
format-connected-padding = 1
format-disconnected =
label-connected = 󰁅 %downspeed:7% 󰁝 %upspeed:7%
label-connected-foreground = ${colors.teal}

[module/filesystem]
type = internal/fs
interval = 45
mount-0 = /
format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.warning}
format-mounted-padding = 1
label-mounted = %percentage_used%%
label-unmounted =

[module/temperature]
type = custom/script
exec = $HOME/.config/polybar/scripts/temp.sh
interval = 4
format = <label>
format-padding = 1
