; AutoBSPWN polybar v3.0.0 — "pills" layout (look inspired by r1vs3c/auto-bspwm; own config)
;   left  : [launcher][IP][VPN]  · tools · clipboard · theme
;   center: workspaces as dots (● focused · ◉ occupied · ○ empty)
;   right : updates · cpu · ram · battery · tray  [target][volume][clock][power]
; Works on polybar 3.6.3 (Parrot 6) and 3.7.x (Parrot 7 / Kali):
;   custom/text uses "content" (3.6 needs it; 3.7 accepts it with a deprecation notice).
; include-file does NOT understand ${env:...}: keep the leading "~".
; Colors: ~/.config/polybar/colors.ini (written by theme-sync from themes/<theme>.ini)
include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 0
padding = 0
module-margin = 0
separator =
; font-0 text · font-1 the round pill caps · font-2 icons / workspace dots
font-0 = JetBrainsMono Nerd Font:style=Bold:size=9;3
font-1 = JetBrainsMono Nerd Font:size=17;4
font-2 = JetBrainsMono Nerd Font:size=11;3
font-3 = Hack Nerd Font:size=10;3
font-4 = FontAwesome:size=10;3

modules-left = launcher cap-l1 ethernet cap-l2 vpn cap-l3 tools clip theme
modules-center = bspwm
modules-right = updates cpu memory battery cap-r3 target cap-r2 pulseaudio cap-r1 clock power

; Polybar < 3.7 (Parrot 6): launch.sh sets POLYBAR_TRAY_POS=right on the first bar
; Polybar 3.7+ (Parrot 7 / Kali): tray-position=none and the internal/tray module is used
tray-position = ${env:POLYBAR_TRAY_POS:none}
tray-padding = 4
tray-maxsize = 15
tray-background = ${colors.background}

cursor-click = pointer
cursor-scroll = ns-resize
; A docked bar: bspwm reserves its space (no top_padding needed)
override-redirect = false
wm-restack = bspwm
enable-ipc = true

; Same bar + internal/tray module (polybar 3.7+, first monitor). launch.sh picks it.
; (polybar only expands ${env:...} when it is the whole value, so the module list can't be
;  switched with an env var — a second bar section is the portable way.)
[bar/main-tray]
inherit = bar/main
modules-right = updates cpu memory battery tray cap-r3 target cap-r2 pulseaudio cap-r1 clock power

[module/tray]
type = internal/tray
format-padding = 1
tray-size = 15
tray-padding = 4
tray-background = ${colors.background}

; ---------------------------------------------------------------- pill caps
; A cap is a half circle drawn in the color of the pill it closes, on the color behind it.
[module/cap-l1]
type = custom/text
content = ""
content-font = 2
content-foreground = ${colors.shade1}
content-background = ${colors.shade2}

[module/cap-l2]
type = custom/text
content = ""
content-font = 2
content-foreground = ${colors.shade2}
content-background = ${colors.shade3}

[module/cap-l3]
type = custom/text
content = ""
content-font = 2
content-foreground = ${colors.shade3}
content-background = ${colors.background}

[module/cap-r3]
type = custom/text
content = ""
content-font = 2
content-foreground = ${colors.shade3}
content-background = ${colors.background}

[module/cap-r2]
type = custom/text
content = ""
content-font = 2
content-foreground = ${colors.shade2}
content-background = ${colors.shade3}

[module/cap-r1]
type = custom/text
content = ""
content-font = 2
content-foreground = ${colors.shade1}
content-background = ${colors.shade2}

; ---------------------------------------------------------------- left pills
[module/launcher]
; left: apps (Super+d) · right: system info · middle: reload bar
type = custom/text
content = "  󰀻 "
content-font = 3
content-foreground = ${colors.on-shade}
content-background = ${colors.shade1}
click-left = rofi -show drun &
click-right = $HOME/.config/bspwm/scripts/sysinfo.sh &
click-middle = $HOME/.config/polybar/launch.sh &

[module/ethernet]
; left: copy IP · right: interfaces
type = custom/script
exec = AB_PILL=1 $HOME/.config/polybar/scripts/ethernet_status.sh
interval = 5
format = <label>
format-foreground = ${colors.on-shade}
format-background = ${colors.shade2}
format-padding = 1
click-left = $HOME/.config/polybar/scripts/ethernet_status.sh --copy
click-right = kitty --class floating -e bash -c 'ip -br a; echo; read -r -n1 -p "Enter para cerrar"'

[module/vpn]
; left: VPN / lab switcher (Super+v) · middle: reconnect last · right: copy tun IP
type = custom/script
exec = AB_PILL=1 $HOME/.config/polybar/scripts/vpn_status.sh
interval = 3
format = <label>
format-foreground = ${colors.on-shade}
format-background = ${colors.shade3}
format-padding = 1
click-left = $HOME/.config/bspwm/scripts/vpn-menu.sh &
click-middle = $HOME/.config/bspwm/scripts/vpn-menu.sh --reconnect &
click-right = $HOME/.config/polybar/scripts/vpn_status.sh --copy

; ---------------------------------------------------------------- left icons
[module/tools]
; Pentest tools launcher (Super+p)
type = custom/text
content = "  "
content-font = 3
content-foreground = ${colors.primary}
click-left = $HOME/.config/bspwm/scripts/tools-menu.sh &

[module/clip]
; Clipboard history (Super+c)
type = custom/text
content = " 󰅇 "
content-font = 3
content-foreground = ${colors.teal}
click-left = $HOME/.config/bspwm/scripts/clipboard.sh &

[module/theme]
; left: theme picker (Super+Alt+t) · scroll: cycle themes (Super+Shift+t)
type = custom/text
content = " 󰏘 "
content-font = 3
content-foreground = ${colors.pink}
click-left = $HOME/.config/bspwm/scripts/theme-menu.sh &
click-right = $HOME/.config/bspwm/scripts/wallpaper.sh &
scroll-up = $HOME/.config/bspwm/scripts/theme-menu.sh --next &
scroll-down = $HOME/.config/bspwm/scripts/theme-menu.sh --prev &

; ---------------------------------------------------------------- center
[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
format = <label-state>
label-focused = 
label-focused-foreground = ${colors.primary}
label-focused-padding = 1
label-focused-font = 3
label-occupied = 
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-occupied-font = 3
label-urgent = 
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1
label-urgent-font = 3
label-empty = 
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-empty-font = 3

; Old name kept for custom bars
[module/xwindow]
type = internal/xwindow
format = <label>
label = %title:0:42:…%
label-foreground = ${colors.muted}

; ---------------------------------------------------------------- right icons
[module/updates]
type = custom/script
exec = $HOME/.config/polybar/scripts/updates.sh
interval = 900
format = <label>
format-padding = 1
click-left = kitty --class floating -e bash -c 'sudo apt update && apt list --upgradable; echo; read -r -n1 -p "Enter para cerrar"'

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}
format-padding = 1
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
format-padding = 1
label = %percentage_used:2%%

[module/battery]
type = custom/script
exec = $HOME/.config/polybar/scripts/battery.sh
interval = 30
format = <label>
format-padding = 1

; Optional modules (add them to modules-right if you want them)
[module/netspeed]
type = internal/network
interface = ${env:POLYBAR_NET_IFACE:}
interface-type = wired
interval = 2
accumulate-stats = true
unknown-as-up = true
format-connected = <label-connected>
format-connected-padding = 1
format-disconnected =
label-connected = 󰁅 %downspeed:7% 󰁝 %upspeed:7%
label-connected-foreground = ${colors.teal}

[module/filesystem]
type = internal/fs
interval = 45
mount-0 = /
format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.warning}
format-mounted-padding = 1
label-mounted = %percentage_used%%
label-unmounted =

[module/temperature]
type = custom/script
exec = $HOME/.config/polybar/scripts/temp.sh
interval = 4
format = <label>
format-padding = 1

; ---------------------------------------------------------------- right pills
[module/target]
; Target HUD — left: actions menu (Super+i) · middle: copy IP · right: set / change target
type = custom/script
exec = AB_PILL=1 $HOME/.config/polybar/scripts/focus_ip.sh
interval = 2
format = <label>
format-foreground = ${colors.on-shade}
format-background = ${colors.shade3}
format-padding = 1
click-left = $HOME/.config/bspwm/scripts/target-menu.sh &
click-middle = $HOME/.config/polybar/scripts/focus_ip.sh --copy
click-right = $HOME/.config/bspwm/scripts/target-menu.sh --set &

; v2.0 name, kept so custom bars that still list "focusip" keep working
[module/focusip]
inherit = module/target

[module/pulseaudio]
; scroll: volume · left: mute · right: pavucontrol
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.on-shade}
format-volume-background = ${colors.shade2}
format-volume-padding = 1
label-volume = %percentage%%
format-muted = <label-muted>
format-muted-foreground = ${colors.on-shade-dim}
format-muted-background = ${colors.shade2}
format-muted-padding = 1
label-muted = 󰝟 mute
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol >/dev/null 2>&1 &

[module/clock]
; left: calendar under the clock · right: date + time notification
type = custom/script
exec = $HOME/.config/polybar/scripts/clock.sh
interval = 5
format = <label>
format-foreground = ${colors.on-shade}
format-background = ${colors.shade1}
format-padding = 1
click-left = $HOME/.config/bspwm/scripts/calendar.sh &
click-right = notify-send -a AutoBSPWN "$(date '+%A %d %B %Y')" "$(date '+%H:%M:%S')"

; Old name (v2.x bars listed "date")
[module/date]
inherit = module/clock

[module/power]
; Power menu (Super+Shift+e)
type = custom/text
content = "   "
content-font = 3
content-foreground = ${colors.on-shade}
content-background = ${colors.shade1}
click-left = $HOME/.config/bspwm/scripts/power-menu.sh &
