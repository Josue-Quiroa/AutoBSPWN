# AutoBSPWN — scope de este target. Lo usan scope-check, tscan, los wrappers de nmap/ffuf,
# el menú del target (Super+i) y la barra (target en ROJO si está fuera de scope).
#
#   in:  <CIDR | IP | 10.0.0.5-20 | host | *.dominio>     dentro del alcance
#   out: <lo mismo>                                        exclusión: SIEMPRE gana
#
# · Varias entradas por línea, separadas por espacios o comas. # = comentario.
# · *.dominio cubre los subdominios (a.corp.local); el dominio raíz se añade aparte.
# · Los nombres se comprueban por patrón y por /etc/hosts (nunca por DNS).
# · Sin líneas in: → todo lo no excluido está dentro. Sin reglas → no se bloquea nada.
#
# Ejemplo:
# in:  10.10.11.0/24
# in:  corp.local *.corp.local
# out: 10.10.11.1
# out: vpn.corp.local
