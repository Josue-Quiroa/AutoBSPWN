# AutoBSPWN — comandos rápidos del menú del target (Super+i). Una línea por comando:
#   Etiqueta | comando
# Variables: {ip} {name} {dir} {ports}
#   {ip}    IP del target activo          {name}  su nombre (vacío si no tiene)
#   {dir}   ~/targets/<ip> (se crea)      {ports} puertos de ports.txt, p. ej. 22,80,445
# Úsalas sueltas o dentro de "...": llegan como variables ya entrecomilladas, nunca se ejecutan como código.
# El comando corre con bash dentro de ~/targets/<ip>, en una terminal que espera Enter.
# Quita el # de los que quieras usar:
# Gobuster dir | gobuster dir -u http://{ip} -w /usr/share/wordlists/dirb/common.txt -o {dir}/gobuster.txt
# Nmap UDP top | sudo nmap -sU --top-ports 50 {ip} -oN {dir}/udp.txt
# Nmap scripts vuln | nmap -sV --script vuln -p {ports} {ip} -oN {dir}/nmap/vuln.txt
# Ping | ping -c4 {ip}
# Whatweb | whatweb http://{ip}
# NetExec SMB | nxc smb {ip}
# Enum4linux-ng | enum4linux-ng -A {ip} | tee {dir}/enum4linux.txt
