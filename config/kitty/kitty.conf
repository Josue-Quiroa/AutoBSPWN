# AutoBSPWN kitty v3.3.0 (style inspired by r1vs3c/auto-bspwm: round powerline tabs,
# splits with Ctrl+Shift+Enter and Ctrl+arrows; own config)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never
cursor_shape     beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
mouse_hide_wait  3.0
detect_urls      yes
url_style        curly
scrollback_lines 20000
wheel_scroll_multiplier 3.0
enable_audio_bell no
confirm_os_window_close 0
window_padding_width 8
background_opacity 0.92
dynamic_background_opacity yes
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# Splits inside one kitty window
enabled_layouts  splits,stack,tall,grid
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+alt+backslash launch --location=vsplit --cwd=current
map ctrl+alt+minus launch --location=hsplit --cwd=current
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down
map ctrl+shift+z toggle_layout stack
map ctrl+shift+l next_layout
map ctrl+shift+r start_resizing_window

# Tabs
tab_bar_edge     bottom
tab_bar_style    powerline
tab_powerline_style round
active_tab_font_style   bold-italic
inactive_tab_font_style normal
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+alt+t set_tab_title

# Colors come from theme-sync (amethyst, catppuccin, tokyonight, nord, gruvbox, dracula, rosepine, hacker). Reload: SIGUSR1 / ctrl+shift+f5
include theme.conf
