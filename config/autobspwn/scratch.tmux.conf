# AutoBSPWN v3.3.1 — tmux config for the Super+u scratchpad ONLY.
# Loaded by ~/.config/bspwm/scripts/scratchpad.sh on its own tmux server
#   tmux -L autobspwn-scratch -f ~/.config/autobspwn/scratch.tmux.conf new -A -s scratch
# so it never reads nor changes your ~/.tmux.conf or your other tmux sessions.
# Your edits here are kept by Install.sh --update / autobspwn-update (.autobspwn-new next to it).
#
# Terminales (máximo 4), sin prefijo:
#   Alt+1..4            ir a la terminal n
#   Alt+←/→ · Alt+h/l   anterior / siguiente
#   Alt+n               nueva terminal (si ya hay 4 → "máx 4" y no crea nada)
#   Alt+w               cerrar la terminal actual
# Ctrl+b sigue funcionando como siempre (Ctrl+b c también respeta el máximo).

# ---- basics -------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 20000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on          # always 1..n, so Alt+1..4 match the tabs
set -g display-time 1500
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_command}'

# ---- the limit: at most 4 terminals (real, not cosmetic) ------------------------------
# Any way of creating a window (Alt+n, Ctrl+b c, `tmux new-window`) fires this hook; a 5th
# window is closed right away. @scratch_max can be changed here (keep it ≤ 9).
set -g @scratch_max 4
set-hook -g after-new-window {
  if -F "#{e|>:#{session_windows},#{@scratch_max}}" {
    kill-window
    display-message "máx #{@scratch_max} terminales"
  }
}

# ---- keys without prefix (Alt) --------------------------------------------------------
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-h     previous-window
bind -n M-l     next-window
bind -n M-n if -F "#{e|>=:#{session_windows},#{@scratch_max}}" {
  display-message "máx #{@scratch_max} terminales"
} {
  new-window -c "#{pane_current_path}"
}
bind c if -F "#{e|>=:#{session_windows},#{@scratch_max}}" {
  display-message "máx #{@scratch_max} terminales"
} {
  new-window -c "#{pane_current_path}"
}
bind -n M-w if -F "#{==:#{session_windows},1}" {
  display-message "es la última terminal (exit la cierra)"
} {
  kill-window
}

# ---- status bar at the bottom: the open terminals as tabs -----------------------------
# ANSI color names → they follow the kitty theme set by theme-sync.
set -g status on
set -g status-position bottom
set -g status-interval 0
set -g status-justify left
set -g status-style "bg=default,fg=white"
set -g status-left " 󰆍 "
set -g status-left-style "fg=magenta,bold"
set -g status-left-length 6
set -g window-status-separator " "
setw -g window-status-format " #I #W "
setw -g window-status-style "fg=brightblack"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "fg=black,bg=magenta,bold"
setw -g window-status-activity-style "fg=yellow"
set -g status-right "#[fg=brightblack]Alt+1-4 · Alt+←/→ · Alt+n · Alt+w  #[fg=magenta]#{session_windows}/#{@scratch_max} "
set -g status-right-length 60
set -g message-style "fg=black,bg=yellow,bold"
set -g pane-active-border-style "fg=magenta"
