# AutoBSPWN v3.0.0 — GTK3 look inside bspwm (no settings daemon runs there).
# Installed ONLY if you had no ~/.config/gtk-3.0/settings.ini. MATE (xsettings) and
# KDE (kde-gtk-config) override this file in their own sessions, so they are unaffected.
[Settings]
gtk-application-prefer-dark-theme = true
gtk-icon-theme-name = Papirus-Dark
gtk-font-name = Sans 10
gtk-cursor-theme-name = Adwaita
