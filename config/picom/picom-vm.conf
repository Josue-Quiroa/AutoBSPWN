# AutoBSPWN v3.0.0 — picom VM (xrender) profile, LEGACY syntax (picom 10.x/11.x: Parrot 6 / Debian 12).
# picom >= 12 (Parrot 7, Kali) uses picom-rules-vm.conf instead (bspwmrc picks by `picom --version`).
# Rounded corners work on BOTH xrender and glx since picom 9 (new backends).
# VM: xrender (no GPU needed), no vsync, light shadows — corners still rounded
backend = "xrender";
vsync = false;
use-damage = false;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.28;
shadow-offset-x = -8;
shadow-offset-y = -8;

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "class_g = 'jgmenu'"
];

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# kitty: a bit transparent, more when unfocused (r1vs3c style)
opacity-rule = [
  "95:class_g = 'kitty' && focused",
  "85:class_g = 'kitty' && !focused"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
};
