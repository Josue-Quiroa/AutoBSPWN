# AutoBSPWN v3.2.0 — picom physical (glx) profile, LEGACY syntax (picom 10.x/11.x: Parrot 6 / Debian 12).
# picom >= 12 (Parrot 7, Kali) uses picom-rules.conf instead (picom-profile.sh picks by `picom --version`).
# picom 10/11 have NO animation engine: this profile gives fade in/out + dual_kawase blur.
# Rounded corners work on BOTH xrender and glx since picom 9 (new backends).
backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "class_g = 'jgmenu'"
];

shadow-exclude = [
  "class_g = 'Eww'",
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Frosted glass behind translucent windows (kitty, rofi). dual_kawase = fast GPU blur.
blur: {
  method = "dual_kawase";
  strength = 5;
};
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "window_type = 'dnd'",
  "class_g = 'Polybar'",
  "class_g = 'slop'",
  "class_g = 'flameshot'",
  "class_g = 'jgmenu'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Opacity: the FIRST matching rule wins. Security tools / browsers stay 100 % opaque so
# screenshots and PoCs are never tinted (Burp, Firefox/Chromium, Wireshark, Ghidra, ZAP…).
opacity-rule = [
  "100:class_g *?= 'burp' || class_g *?= 'firefox' || class_g *?= 'chrom' || class_g *?= 'brave' || class_g *?= 'librewolf' || class_g *?= 'wireshark' || class_g *?= 'ghidra' || class_g *?= 'caido' || class_g *?= 'zap' || class_g *?= 'obs' || class_g *?= 'mpv' || class_g *?= 'vlc' || class_g *?= 'remmina' || class_g *?= 'vmware' || class_g *?= 'virtualbox'",
  "92:class_g = 'kitty' && focused",
  "85:class_g = 'kitty' && !focused",
  "90:class_g = 'Rofi'"
];

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
};
