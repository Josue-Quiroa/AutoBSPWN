# AutoBSPWN v3.3.0 — picom physical (glx) — animations + blur profile, "rules:" syntax (picom >= 12: Parrot 7 / Debian 13 / Kali).
# Do not mix with opacity-rule / *-exclude / wintypes: picom 12+ warns and ignores them.
# Rounded corners work on BOTH xrender and glx.
backend = "glx";
vsync = true;
use-damage = true;

shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;

corner-radius = 10;
shadow = true;
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;
frame-opacity = 1.0;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Frosted glass behind translucent windows (kitty, rofi). dual_kawase = fast GPU blur.
blur: {
  method = "dual_kawase";
  strength = 5;
};
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

# Animations (picom 12+ presets, FT-Labs / pijulius style):
#   open/close   → fade + zoom ("appear"/"disappear")
#   show/hide    → slide (bspwm unmaps windows when you switch desktop or hide them,
#                  so desktop switches and the Super+u scratchpad slide in/out)
#   geometry     → windows glide to their new tile when the layout changes (EXPERIMENTAL
#                  in picom; delete that block if dragging floating windows feels laggy)
animations = (
  { triggers = [ "open" ];  preset = "appear";    scale = 0.85; duration = 0.18; },
  { triggers = [ "close" ]; preset = "disappear"; scale = 0.85; duration = 0.14; },
  { triggers = [ "show" ];  preset = "slide-in";  direction = "down"; duration = 0.18; },
  { triggers = [ "hide" ];  preset = "slide-out"; direction = "up";   duration = 0.14; },
  { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.15; }
);

# Rules: LATER rules override earlier ones → the "always opaque" rule goes last.
rules: (
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Polybar'"; corner-radius = 0; shadow = false; blur-background = false; },
  { match = "class_g = 'Dunst' || name = 'Notification' || class_g ?= 'Notify-osd'"; corner-radius = 0; shadow = false; },
  { match = "class_g = 'Eww'"; corner-radius = 18; },
  { match = "class_g = 'jgmenu'"; corner-radius = 0; blur-background = false; },
  { match = "class_g = 'slop' || class_g = 'flameshot' || class_g = 'Conky' || _GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },
  { match = "window_type = 'tooltip'"; shadow = false; opacity = 0.95; full-shadow = false; blur-background = false; },
  { match = "window_type = 'dnd'"; shadow = false; blur-background = false; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'"; opacity = 0.98; },
  { match = "class_g = 'kitty' && focused"; opacity = 0.92; },
  { match = "class_g = 'kitty' && !focused"; opacity = 0.85; },
  { match = "class_g = 'Rofi'"; opacity = 0.90; },
  # Security tools / browsers: 100 % opaque so screenshots and PoCs are never tinted
  { match = "class_g *?= 'burp' || class_g *?= 'firefox' || class_g *?= 'chrom' || class_g *?= 'brave' || class_g *?= 'librewolf' || class_g *?= 'wireshark' || class_g *?= 'ghidra' || class_g *?= 'caido' || class_g *?= 'zap' || class_g *?= 'obs' || class_g *?= 'mpv' || class_g *?= 'vlc' || class_g *?= 'remmina' || class_g *?= 'vmware' || class_g *?= 'virtualbox'"; opacity = 1.0; blur-background = false; }
);
