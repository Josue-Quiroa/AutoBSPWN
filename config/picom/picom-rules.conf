# AutoBSPWN v3.0.0 — picom physical (glx) profile, "rules:" syntax (picom >= 12: Parrot 7 / Debian 13 / Kali).
# Do not mix with opacity-rule / *-exclude / wintypes: picom 12+ warns and ignores them.
# Rounded corners work on BOTH xrender and glx.
backend = "glx";
vsync = true;
use-damage = true;

shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;

corner-radius = 10;
shadow = true;
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;
frame-opacity = 1.0;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

rules: (
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Polybar'"; corner-radius = 0; shadow = false; },
  { match = "class_g = 'Dunst' || name = 'Notification' || class_g ?= 'Notify-osd'"; corner-radius = 0; shadow = false; },
  { match = "class_g = 'jgmenu'"; corner-radius = 0; },
  { match = "class_g = 'slop' || class_g = 'Conky' || _GTK_FRAME_EXTENTS@"; shadow = false; },
  { match = "window_type = 'tooltip'"; shadow = false; opacity = 0.95; full-shadow = false; },
  { match = "window_type = 'dnd'"; shadow = false; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'"; opacity = 0.98; },
  { match = "class_g = 'kitty' && focused"; opacity = 0.95; },
  { match = "class_g = 'kitty' && !focused"; opacity = 0.85; }
);
