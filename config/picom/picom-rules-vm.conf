# AutoBSPWN v3.3.0 — picom VM (xrender) — no animations, no blur profile, "rules:" syntax (picom >= 12: Parrot 7 / Debian 13 / Kali).
# Do not mix with opacity-rule / *-exclude / wintypes: picom 12+ warns and ignores them.
# Rounded corners work on BOTH xrender and glx.
# VM: xrender (no GPU needed), no vsync, light shadows — corners still rounded
backend = "xrender";
vsync = false;
use-damage = false;

shadow-radius = 10;
shadow-opacity = 0.28;
shadow-offset-x = -8;
shadow-offset-y = -8;

corner-radius = 10;
shadow = true;
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
frame-opacity = 1.0;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# VM: no blur (dual_kawase needs glx; CPU blur on xrender makes VMs crawl) and no
# animations (software rendering → stutter). Fading still works.
blur: { method = "none"; };
blur-background = false;

# Rules: LATER rules override earlier ones → the "always opaque" rule goes last.
rules: (
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Polybar'"; corner-radius = 0; shadow = false; },
  { match = "class_g = 'Dunst' || name = 'Notification' || class_g ?= 'Notify-osd'"; corner-radius = 0; shadow = false; },
  { match = "class_g = 'Eww'"; corner-radius = 18; },
  { match = "class_g = 'jgmenu'"; corner-radius = 0; },
  { match = "class_g = 'slop' || class_g = 'flameshot' || class_g = 'Conky' || _GTK_FRAME_EXTENTS@"; shadow = false; },
  { match = "window_type = 'tooltip'"; shadow = false; opacity = 0.95; full-shadow = false; },
  { match = "window_type = 'dnd'"; shadow = false; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'"; opacity = 0.98; },
  { match = "class_g = 'kitty' && focused"; opacity = 0.92; },
  { match = "class_g = 'kitty' && !focused"; opacity = 0.85; },
  { match = "class_g = 'Rofi'"; opacity = 0.90; },
  # Security tools / browsers: 100 % opaque so screenshots and PoCs are never tinted
  { match = "class_g *?= 'burp' || class_g *?= 'firefox' || class_g *?= 'chrom' || class_g *?= 'brave' || class_g *?= 'librewolf' || class_g *?= 'wireshark' || class_g *?= 'ghidra' || class_g *?= 'caido' || class_g *?= 'zap' || class_g *?= 'obs' || class_g *?= 'mpv' || class_g *?= 'vlc' || class_g *?= 'remmina' || class_g *?= 'vmware' || class_g *?= 'virtualbox'"; opacity = 1.0; }
);
